<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetailInsight — จัดการผู้ใช้งาน</title>
<link rel="stylesheet" href="assets/css/admin-console.css">
</head>
<body>
<header class="admin-top">
 <button class="menu-btn" id="menuBtn">☰</button>
 <div class="admin-brand"><b>RetailInsight</b><span>Admin Console</span></div>
 <div class="top-spacer"></div>
 <span class="admin-role">ADMIN</span>
</header>
<div class="admin-layout">
<aside class="side" id="side">
 <a href="admin-users.html" class="active">ผู้ใช้งานและ QR</a>
 <a href="admin-user-month-import.html">งานรายบุคคล</a>
 <a href="admin-import.html">ข้อมูลร้าน</a>
 <a href="admin-field-visibility.html">การมองเห็นข้อมูล</a>
 <a href="admin-login.html">ออกจากระบบ</a>
</aside>
<main class="content">
 <div class="page-head">
  <div><h1>ผู้ใช้งานและ QR</h1><p>จัดการบัญชีและ QR ประจำตัวแบบถาวร</p></div>
  <button id="newUserBtn" class="btn primary">+ เพิ่มผู้ใช้งาน</button>
 </div>

 <section class="metric-grid">
  <div class="metric"><span>ทั้งหมด</span><b id="metricTotal">0</b></div>
  <div class="metric"><span>ผู้ปฏิบัติงาน</span><b id="metricField">0</b></div>
  <div class="metric"><span>QR ใช้งาน</span><b id="metricQr">0</b></div>
  <div class="metric"><span>ปิดบัญชี</span><b id="metricOff">0</b></div>
 </section>

 <section class="panel">
  <div class="filters">
   <label class="search">ค้นหา<input id="userSearch" placeholder="ชื่อ รหัสพนักงาน หรือ username"></label>
   <label>สิทธิ์<select id="roleFilter"><option value="">ทั้งหมด</option><option value="FIELD_USER">ผู้ปฏิบัติงาน</option><option value="REVIEWER">หัวหน้างาน</option><option value="ADMIN">Admin</option><option value="FINANCE">การเงิน</option><option value="EXECUTIVE">ผู้บริหาร</option></select></label>
   <label>สถานะ<select id="statusFilter"><option value="ALL">ทั้งหมด</option><option value="ACTIVE">เปิดใช้งาน</option><option value="INACTIVE">ปิดใช้งาน</option></select></label>
   <button id="refreshUsersBtn" class="btn secondary">โหลดข้อมูล</button>
  </div>
  <div id="usersStatus" class="table-status">พร้อมใช้งาน</div>
  <div class="table-wrap">
   <table><thead><tr><th>ผู้ใช้งาน</th><th>รหัสพนักงาน</th><th>สิทธิ์</th><th>บัญชี</th><th>QR ประจำตัว</th><th>ใช้งานล่าสุด</th><th></th></tr></thead><tbody id="usersBody"></tbody></table>
  </div>
 </section>
</main>
</div>

<dialog id="userDialog"><form method="dialog" class="dialog-card"><div class="dialog-head"><h3 id="userDialogTitle">เพิ่มผู้ใช้งาน</h3><button id="closeUserDialog" class="icon-btn">×</button></div>
<input id="editUserId" type="hidden">
<div class="form-grid">
<label class="full">ชื่อผู้ใช้งาน<input id="editDisplayName"></label>
<label>Username<input id="editUsername"></label>
<label>รหัสพนักงาน<input id="editEmployeeCode"></label>
<label class="full">รหัสผ่าน <small>ใช้สำหรับ Admin/หัวหน้างาน</small><input id="editPassword" type="password" autocomplete="new-password"></label>
<label class="full">สิทธิ์<select id="editRoleCode"><option value="FIELD_USER">ผู้ปฏิบัติงาน</option><option value="REVIEWER">หัวหน้างาน</option><option value="ADMIN">Admin</option><option value="FINANCE">การเงิน</option><option value="EXECUTIVE">ผู้บริหาร</option></select></label>
</div><button id="saveUserBtn" class="btn primary full-btn">บันทึก</button></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/ui-alerts.js"></script><script src="assets/js/api.js"></script><script src="assets/js/admin-users.js"></script>
</body></html>
