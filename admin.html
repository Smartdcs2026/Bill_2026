<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการการเข้าสู่ระบบ</title><link rel="stylesheet" href="assets/css/app.css"></head><body><header class="topbar"><strong>Admin — การเข้าสู่ระบบผู้ปฏิบัติงาน</strong><a href="login.html" style="color:#fff">หน้าเข้าสู่ระบบ</a></header><main class="page"><div class="grid two"><section class="panel"><h2>กำหนดรหัสกลาง 10 หลัก</h2><p class="muted">ผู้ปฏิบัติงานทุกคนใช้รหัสชุดเดียวกันร่วมกับ QR รายบุคคล</p><div class="stack"><label>รหัสใหม่<input id="sharedCodeAdmin" class="input code-input" maxlength="10" placeholder="เช่น A7K9P2X4Q8"></label><label>Admin Bootstrap Token<input id="adminToken" class="input" type="password"></label><button id="setSharedCodeBtn" class="btn btn-primary">บันทึกรหัสกลาง</button></div><div id="sharedCodeStatus" class="status">ยังไม่ได้ดำเนินการ</div></section>
<section class="panel"><h2>Generate QR รายบุคคล</h2><div class="stack"><label>User ID<input id="userId" class="input" value="usr_field_001"></label><label>อายุ QR (วัน)<input id="expiresDays" class="input" type="number" min="1" max="365" value="30"></label><label class="check-line"><input id="revokeExisting" type="checkbox" checked> ยกเลิก QR เดิมของผู้ใช้นี้เมื่อสร้างใหม่</label><button id="createQrBtn" class="btn btn-primary">Generate QR</button></div><div id="adminStatus" class="status">พร้อมใช้งาน</div></section>
<section class="panel"><h2>QR ที่สร้าง</h2><div class="qr-wrap"><canvas id="qrCanvas"></canvas></div><p id="qrUserName" class="muted"></p><p>Credential ID: <code id="credentialId"></code></p><div class="actions"><button id="downloadQrBtn" class="btn btn-secondary">ดาวน์โหลด PNG</button><button id="revokeQrBtn" class="btn btn-danger">ยกเลิก QR</button></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/admin-qr.js"></script></body></html>
