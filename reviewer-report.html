<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายงาน PDF | RetailInsight</title><link rel="stylesheet" href="assets/css/reviewer-report.css?v=20260731-v2">
<style>*{box-sizing:border-box}body{margin:0;background:#eef4fa;font-family:"Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;color:#12223a}.rp-top{height:64px;background:#0b1830;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 22px}.rp-top div{display:flex;flex-direction:column}.rp-top b{font-size:20px}.rp-top span{font-size:12px;color:#c8d5e8}.rp-top a{color:#fff;text-decoration:none;border:1px solid #415674;border-radius:8px;padding:9px 13px}.rp-main{padding:16px;max-width:1500px;margin:auto}.rp-controls{background:#fff;border:1px solid #d6e1ee;border-radius:13px;padding:12px;display:grid;grid-template-columns:repeat(5,1fr) auto auto;gap:9px}.rp-controls label{font-size:11px;color:#64748b}.rp-controls input,.rp-controls select,.rp-controls button{display:block;width:100%;height:40px;border:1px solid #b9c9da;border-radius:8px;background:#fff;padding:0 9px;margin-top:4px}.rp-controls button{align-self:end;font-weight:700}.rp-controls .primary{background:#1477e8;color:#fff;border:0}.rp-status{margin-top:10px;background:#fff;border:1px solid #d6e1ee;border-radius:11px;padding:11px;display:grid;grid-template-columns:240px 1fr 280px;gap:10px;align-items:center}.rp-status progress{width:100%}.rp-note{font-size:12px;color:#64748b;padding:10px}.rp-pdf-stage{position:fixed;left:-20000px;top:0}.pdf-page{width:1122px;height:793px;background:#fff;padding:22px;display:grid;grid-template-rows:38px 1fr 24px;gap:8px;color:#111;font-family:"Noto Sans Thai","Leelawadee UI",sans-serif}.pdf-head{display:flex;justify-content:space-between;border-bottom:2px solid #1f6f68;padding-bottom:5px}.pdf-head b{font-size:16px}.pdf-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:9px}.pdf-card{border:1px solid #92aaa7;border-radius:6px;padding:7px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}.pdf-card h3{margin:0;font-size:12px}.pdf-card .meta{font-size:8px;color:#445;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pdf-body{display:grid;grid-template-columns:42% 58%;gap:6px;min-height:0;margin-top:4px}.pdf-image{border:1px solid #ccd8d6;display:grid;place-items:center;overflow:hidden}.pdf-image img{width:100%;height:100%;object-fit:contain}.pdf-pos{width:100%;border-collapse:collapse;font-size:7px}.pdf-pos th,.pdf-pos td{border:1px solid #ccd8d6;padding:2px}.pdf-pos th{background:#dceeea}.pdf-foot{font-size:7px;border-top:1px solid #d5dfdd;padding-top:3px;display:flex;justify-content:space-between}.pdf-page-foot{font-size:8px;display:flex;justify-content:space-between;border-top:1px solid #aaa;padding-top:4px}@media(max-width:900px){.rp-controls{grid-template-columns:1fr 1fr}.rp-status{grid-template-columns:1fr}}</style></head><body>
<header class="rp-top"><div><b>RetailInsight</b><span>รายงานผลการปฏิบัติงาน</span></div><a href="reviewer.html">กลับหน้าตรวจงาน</a></header>
<main class="rp-main">
<section class="rp-controls">
<label>วันที่เริ่ม<input id="fromDate" type="date"></label><label>วันที่สิ้นสุด<input id="toDate" type="date"></label>
<label>สถานะ<select id="reportStatus"><option value="APPROVED">อนุมัติแล้ว</option><option value="ALL">ทั้งหมด</option><option value="RETURNED">ส่งกลับ</option></select></label>
<label>ผู้อนุมัติรายงาน<input id="approverName" placeholder="ชื่อผู้อนุมัติ"></label>
<label>ภาพในรายงาน<select id="imageMode"><option value="PRIMARY">รูปหลัก 1 รูปต่อร้าน</option><option value="NONE">ไม่แสดงรูป</option></select></label>
<button id="previewBtn">ตรวจจำนวน</button><button id="exportBtn" class="primary">สร้าง PDF</button>
</section>
<section class="rp-status"><b id="reportSummary">เลือกช่วงวันที่</b><progress id="reportProgress" value="0" max="100"></progress><span id="reportMessage"></span></section>
<section class="rp-note">A4 แนวนอน 6 ร้านต่อหน้า ระบบแบ่งไฟล์ทุก 120 ร้านเพื่อลดการใช้หน่วยความจำ</section>
</main>
<div id="pdfStage" class="rp-pdf-stage"></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/api.js?v=20260731-v2"></script><script src="assets/js/reviewer-report.js?v=20260731-v2"></script></body></html>
