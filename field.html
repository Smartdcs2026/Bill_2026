<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>RetailInsight — งานของฉัน</title><link rel="stylesheet" href="assets/css/field-workspace.css?v=r05s05rev06"></head><body>
<header class="topbar"><div class="identity"><span class="logo">RI</span><span><b>RetailInsight</b><small id="userName">กำลังโหลด…</small></span></div><div class="top-actions"><span id="syncDot" class="sync-dot" aria-label="สถานะระบบ"></span><button id="refreshTopBtn" class="icon-btn compact" aria-label="อัปเดตงาน" title="อัปเดตงาน">↻</button><button id="calendarBtn" class="icon-btn" aria-label="ปฏิทิน">▦<i id="calendarBadge" class="hidden">0</i></button><button id="menuBtn" class="icon-btn" aria-label="เมนู">⋮</button></div></header>
<nav class="work-tabs" aria-label="สถานะงาน"><button data-filter="ALL"><b id="totalJobs">0</b><small>ทั้งหมด</small></button><button data-filter="DRAFT"><b id="draftJobs">0</b><small>กำลังทำ <em id="draftSavedMeta"></em></small></button><button data-filter="SENT"><b id="sentJobs">0</b><small>ส่งแล้ว</small></button></nav>
<main><section id="jobList" class="store-list"></section></main>
<div id="calendarSheet" class="overlay hidden"><section class="sheet"><div class="handle"></div><header><span><small>WORK CALENDAR</small><h2>ปฏิทินวันทำงาน</h2></span><button id="closeCalendarBtn">×</button></header><div class="month-nav"><button id="prevMonthBtn">‹</button><b id="calendarMonthLabel">-</b><button id="nextMonthBtn">›</button></div><div class="week"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div><div id="calendarGrid" class="calendar"></div><footer><span><i></i> วันที่มีงาน</span><button id="showAllDatesBtn">แสดงทุกวัน</button></footer></section></div>
<div id="menuSheet" class="overlay hidden"><section class="sheet menu"><div class="handle"></div><div class="system-info"><span id="menuSyncDot" class="sync-dot"></span><div><b id="menuSyncTitle">พร้อมใช้งาน</b><small id="menuSyncText">ข้อมูลเก็บไว้ในโทรศัพท์</small></div></div><button id="refreshBtn">↻ โหลดรายการงานใหม่</button><button id="showDraftBtn">✓ ไปยังงานที่บันทึกไว้</button><button id="logoutBtn" class="danger">↪ ออกจากระบบ</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/js/config.js?v=r05s05rev06"></script><script src="assets/js/api.js?v=r05s05rev06"></script><script src="assets/js/ui-alerts.js?v=r05s05rev06"></script><script src="assets/js/date-th.js?v=r05s05rev06"></script><script src="assets/js/local-draft-db.js?v=r05s05rev06"></script><script src="assets/js/field-workspace.js?v=r05s05rev06"></script></body></html>
