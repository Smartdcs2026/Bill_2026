<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174ea6">
<title>RetailInsight — งานของฉัน</title>
<link rel="stylesheet" href="assets/css/field-workspace.css">
</head>
<body>
<header class="field-header">
  <div class="header-main">
    <div>
      <div class="brand">RetailInsight</div>
      <div class="welcome">สวัสดี <strong id="userName">กำลังโหลด…</strong></div>
    </div>
    <button id="logoutBtn" class="logout-btn" type="button">ออกจากระบบ</button>
  </div>

  <div class="work-toolbar">
    <label class="month-field">
      <span>เดือนงาน</span>
      <select id="monthSelect"></select>
    </label>
    <div class="work-summary">
      <div><b id="totalJobs">0</b><span>งานทั้งหมด</span></div>
      <div><b id="draftJobs">0</b><span>กำลังทำ</span></div>
      <div><b id="sentJobs">0</b><span>ส่งแล้ว</span></div>
    </div>
  </div>
</header>

<main class="page">
  <section class="field-tip">
    <div>
      <b>งานของฉัน</b>
      <span>แตะร้านเพื่อเปิดกรอกยอดลูกค้า วันที่ และเวลา</span>
    </div>
    <span id="draftStatus" class="save-state">พร้อมใช้งาน</span>
  </section>

  <section id="jobList" class="job-list"></section>
</main>

<nav class="bottom-nav" aria-label="เมนูผู้ปฏิบัติงาน">
  <button class="active" type="button"><span>▦</span><b>งานของฉัน</b></button>
  <button id="draftNavBtn" type="button"><span>✓</span><b>ฉบับร่าง</b></button>
  <button id="topBtn" type="button"><span>↑</span><b>ด้านบน</b></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui-alerts.js"></script>
<script src="assets/js/date-th.js"></script>
<script src="assets/js/local-draft-db.js"></script>
<script src="assets/js/field-workspace.js"></script>
</body>
</html>
