<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>RetailInsight — งานของฉัน</title><link rel="stylesheet" href="assets/css/field-workspace.css"></head><body>
<header class="topbar"><div class="identity"><span class="logo">RI</span><span><b>RetailInsight</b><small id="userName">กำลังโหลด…</small></span></div><div class="top-actions"><button id="calendarBtn" class="icon-btn">▦<i id="calendarBadge" class="hidden">0</i></button><button id="menuBtn" class="icon-btn">⋮</button></div></header>
<div id="connectionBar" class="connection-bar local"><span class="connection-state"><i></i><span id="connectionText">ทำงานในเครื่อง</span></span><button id="syncBtn">อัปเดตงาน</button></div>
<section class="summary"><div class="date-context"><small>งานที่แสดง</small><b id="selectedDateLabel">ทุกวันที่มีงาน</b><span>เลือกวันจากปุ่มปฏิทินด้านบน</span></div><div class="counts"><span><b id="totalJobs">0</b><small>ทั้งหมด</small></span><span><b id="draftJobs">0</b><small>กำลังทำ</small></span><span><b id="sentJobs">0</b><small>ส่งแล้ว</small></span></div></section>
<main><div class="heading"><span><b id="listTitle">รายการงาน</b><small id="listSubtitle">แตะรายการเพื่อเริ่มหรือทำงานต่อ</small></span><mark id="draftStatus" class="hidden">บันทึกแล้ว</mark></div><section id="jobList" class="store-list"></section></main>
<div id="calendarSheet" class="overlay hidden"><section class="sheet"><div class="handle"></div><header><span><small>WORK CALENDAR</small><h2>ปฏิทินวันทำงาน</h2></span><button id="closeCalendarBtn">×</button></header><div class="month-nav"><button id="prevMonthBtn">‹</button><b id="calendarMonthLabel">-</b><button id="nextMonthBtn">›</button></div><div class="week"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div><div id="calendarGrid" class="calendar"></div><footer><span><i></i> วันที่มีงาน</span><button id="showAllDatesBtn">แสดงทุกวัน</button></footer></section></div>
<div id="menuSheet" class="overlay hidden"><section class="sheet menu"><div class="handle"></div><button id="refreshBtn">↻ อัปเดตงานจากระบบ</button><button id="showDraftBtn">✓ ไปยังงานที่บันทึกไว้</button><button id="logoutBtn" class="danger">↪ ออกจากระบบ</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/ui-alerts.js"></script><script src="assets/js/date-th.js"></script><script src="assets/js/local-draft-db.js"></script><script src="assets/js/field-workspace.js"></script></body></html>
