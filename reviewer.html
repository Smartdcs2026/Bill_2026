<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ตรวจงาน | RetailInsight</title>
<link rel="stylesheet" href="assets/css/reviewer-workspace.css?v=20260730-s22">
</head>
<body>
<header class="rv-top">
  <div class="rv-brand">
    <span class="rv-logo">RI</span>
    <div><strong>RetailInsight</strong><span id="reviewerName">หัวหน้างาน</span></div>
  </div>
  <div class="rv-top-tools">
    <nav class="rv-status-tabs" aria-label="สถานะงาน">
      <button type="button" data-status="PENDING" class="active">รอตรวจ <b id="pendingCount">0</b></button>
      <button type="button" data-status="APPROVED">อนุมัติ <b id="approvedCount">0</b></button>
      <button type="button" data-status="RETURNED">ส่งกลับ <b id="returnedCount">0</b></button>
    </nav>
    <a class="rv-report-link" href="reviewer-report.html">รายงาน PDF</a>
    <button id="refreshBtn" type="button">อัปเดต</button>
    <button id="logoutBtn" type="button">ออกจากระบบ</button>
  </div>
</header>

<section class="rv-filterbar">
  <input id="searchInput" type="search" placeholder="ค้นหาร้าน ผู้ปฏิบัติงาน หรือรหัส">
  <select id="workerFilter"><option value="">ผู้ปฏิบัติงานทั้งหมด</option></select>
  <input id="dateFilter" type="date" aria-label="วันที่แผนงาน">
  <select id="claimFilter" aria-label="ผู้รับตรวจ">
    <option value="">ผู้รับตรวจทั้งหมด</option>
    <option value="UNCLAIMED">ยังไม่มีผู้รับตรวจ</option>
    <option value="MINE">ฉันกำลังตรวจ</option>
    <option value="OTHERS">ผู้อื่นกำลังตรวจ</option>
  </select>
  <button id="clearFiltersBtn" type="button">ล้าง</button>
  <span id="queueText" class="rv-queue-text">0 รายการ</span>
</section>

<main class="rv-workspace">
  <aside class="rv-list-pane">
    <div class="rv-pane-head"><b>รายการงาน</b><span id="visibleCount">0</span></div>
    <div id="submissionList" class="rv-list"></div>
    <div class="rv-pager">
      <button id="prevPageBtn" type="button">ก่อนหน้า</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextPageBtn" type="button">ถัดไป</button>
    </div>
  </aside>

  <section class="rv-image-pane" id="imagePane">
    <div class="rv-pane-head">
      <div><b id="imageTitle">รูปหลักฐาน</b><span id="imageMeta">ยังไม่ได้เลือกร้าน</span></div>
      <div class="rv-image-controls">
        <button id="rotateLeftBtn" type="button" title="หมุนซ้าย">↶</button>
        <button id="zoomOutBtn" type="button" title="ซูมออก">−</button>
        <button id="zoomResetBtn" type="button">100%</button>
        <button id="zoomInBtn" type="button" title="ซูมเข้า">+</button>
        <button id="rotateRightBtn" type="button" title="หมุนขวา">↷</button>
        <button id="fullImageBtn" type="button">เต็มจอ</button>
      </div>
    </div>
    <div class="rv-image-tabs">
      <button type="button" data-image-kind="ALL" class="active">ทั้งหมด</button>
      <button type="button" data-image-kind="RECEIPT">รูปบิล</button>
      <button type="button" data-image-kind="STORE">รูปร้าน</button>
    </div>
    <div id="galleryStage" class="rv-gallery-stage">
      <button id="galleryPrevBtn" class="rv-gallery-arrow prev" type="button">‹</button>
      <div id="galleryEmpty" class="rv-empty compact">เลือกร้านจากรายการ</div>
      <img id="galleryImage" class="hidden" alt="หลักฐาน">
      <button id="galleryNextBtn" class="rv-gallery-arrow next" type="button">›</button>
      <span id="galleryCounter" class="rv-gallery-counter"></span>
    </div>
    <div id="galleryThumbs" class="rv-gallery-thumbs"></div>
    <div id="imageEditTools" class="rv-image-edit-tools hidden">
      <button type="button" data-upload-category="RECEIPT">เพิ่มรูปบิล</button>
      <button type="button" data-upload-category="STORE">เพิ่มรูปร้าน</button>
      <button id="deleteImageBtn" class="danger" type="button">ลบรูปที่เลือก</button>
    </div>
  </section>

  <section class="rv-data-pane" id="detailPanel">
    <div class="rv-empty">เลือกร้านจากรายการ</div>
  </section>
</main>

<div id="imageViewer" class="rv-viewer hidden" role="dialog" aria-modal="true">
  <div class="rv-viewer-toolbar">
    <span id="viewerCaption">รูปภาพ</span>
    <div>
      <button id="viewerZoomOutBtn" type="button">−</button>
      <button id="viewerZoomResetBtn" type="button">100%</button>
      <button id="viewerZoomInBtn" type="button">+</button>
      <button id="viewerCloseBtn" type="button">ปิด</button>
    </div>
  </div>
  <button id="viewerPrevBtn" class="rv-viewer-nav prev" type="button">‹</button>
  <div class="rv-viewer-stage"><img id="viewerImage" alt="หลักฐาน"></div>
  <button id="viewerNextBtn" class="rv-viewer-nav next" type="button">›</button>
</div>

<aside id="historyDrawer" class="rv-history-drawer hidden" aria-label="ประวัติ POS">
  <div class="rv-history-head">
    <div><b>ประวัติ POS ย้อนหลัง</b><span id="historyStoreName"></span></div>
    <button id="historyCloseBtn" type="button">ปิด</button>
  </div>
  <div class="rv-history-tools">
    <label><input id="historyImagesToggle" type="checkbox"> แสดงรูปย้อนหลัง</label>
    <select id="historyMonths">
      <option value="1">1 เดือน</option>
      <option value="2">2 เดือน</option>
      <option value="3" selected>3 เดือน</option>
    </select>
    <button id="historyReloadBtn" type="button">อัปเดต</button>
  </div>
  <div id="historyContent" class="rv-history-content"></div>
</aside>

<input id="reviewImageInput" type="file" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js?v=20260730-s22"></script>
<script src="assets/js/reviewer-workspace.js?v=20260730-s22"></script>
</body>
</html>
