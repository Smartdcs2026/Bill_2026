<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตรวจงานผู้ปฏิบัติงาน | RetailInsight</title>
<link rel="stylesheet" href="assets/css/reviewer-workspace.css?v=20260730-s17"></head>
<body>
<header class="rv-top"><div><strong>RetailInsight</strong><span id="reviewerName">หัวหน้างาน</span><small class="rv-global-note">คิวตรวจงานส่วนกลาง</small></div><div class="rv-actions"><button id="refreshBtn" type="button">อัปเดต</button><button id="logoutBtn" type="button">ออกจากระบบ</button></div></header>
<main class="rv-shell">
<section class="rv-summary"><button data-status="PENDING" class="active"><b id="pendingCount">0</b><span>รอตรวจ</span></button><button data-status="APPROVED"><b id="approvedCount">0</b><span>อนุมัติแล้ว</span></button><button data-status="RETURNED"><b id="returnedCount">0</b><span>ส่งกลับแก้ไข</span></button></section>
<section class="rv-toolbar"><input id="searchInput" type="search" placeholder="ค้นหาชื่อ รหัสพนักงาน ร้าน หรือรหัสร้าน"><span id="listStatus">กำลังโหลด...</span></section>
<section class="rv-grid"><aside id="submissionList" class="rv-list"></aside><article id="detailPanel" class="rv-detail"><div class="rv-empty">เลือกรายการงานเพื่อดูรายละเอียด</div></article></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/js/config.js"></script><script src="assets/js/api.js?v=20260730-s17"></script><script src="assets/js/reviewer-workspace.js?v=20260730-s17"></script>
</body></html>
