<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>อัปโหลดงานรายบุคคล</title><link rel="stylesheet" href="assets/css/app.css"><style>.wide{max-width:1200px}.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.table-wrap{overflow:auto;max-height:55vh}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th,.data-table td{padding:8px;border-bottom:1px solid #ddd;white-space:nowrap}.bad{background:#fff1f2}.good{background:#f0fdf4}.summary{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;background:#eef2ff}</style></head>
<body><header class="topbar"><strong>Admin — อัปโหลดงานรายบุคคลประจำเดือน</strong><nav><a href="admin-users.html" style="color:#fff">ผู้ใช้งาน</a> · <a href="admin.html" style="color:#fff">หน้าหลัก Admin</a></nav></header>
<main class="page wide"><section class="panel"><h2>1. เลือกเจ้าของงานและเดือน</h2><p class="muted">หนึ่งไฟล์เป็นงานของผู้ปฏิบัติงานหนึ่งคน ระบบจะสร้าง Assignment ให้ทุกแถวโดยอัตโนมัติ</p>
<div class="toolbar"><label>ผู้ปฏิบัติงาน<select id="operatorUserId" class="input"></select></label><label>เดือนงาน<input id="workMonth" class="input" type="month"></label><label>วันที่งานเริ่มต้น (ใช้เมื่อไฟล์ไม่มีวันที่)<input id="defaultWorkDate" class="input" type="date"></label><label>รหัสรอบ<input id="roundId" class="input"></label><label>ชื่อรอบ<input id="roundName" class="input"></label><label>ช่องรูปบิลเริ่มต้น<input id="receiptSlots" class="input" type="number" value="3" min="0" max="30"></label><label>ช่องรูปร้านเริ่มต้น<input id="storeSlots" class="input" type="number" value="5" min="0" max="30"></label></div>
<input id="fileInput" class="input" type="file" accept=".xlsx,.xls,.csv"><div class="actions"><button id="previewBtn" class="btn btn-primary">ตรวจสอบไฟล์</button><button id="commitBtn" class="btn btn-primary" disabled>ยืนยันอัปโหลดงาน</button></div><div id="importStatus" class="status">ยังไม่ได้เลือกไฟล์</div></section>
<section class="panel"><h2>2. ผลตรวจสอบ</h2><div id="summary" class="summary"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>แถว</th><th>แบรนด์</th><th>รหัสร้าน</th><th>ชื่อร้าน</th><th>POS</th><th>วันที่งาน</th><th>ผลตรวจ</th></tr></thead><tbody id="previewBody"></tbody></table></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/ui-alerts.js"></script><script src="assets/js/admin-user-month-import.js"></script></body></html>
