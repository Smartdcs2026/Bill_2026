<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>กำลังเปิดหน้าแผนงานรายบุคคล — RetailInsight</title>
  <meta http-equiv="refresh" content="0;url=admin-user-month-import.html">
  <style>
    :root{font-family:Arial,"Noto Sans Thai",sans-serif;color:#102a50;background:#f4f7fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(440px,100%);text-align:center}
    .mark{width:44px;height:44px;margin:0 auto 14px;border:4px solid #d9e7f8;border-top-color:#1769d2;border-radius:50%;animation:spin .75s linear infinite}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0;color:#5a6e89;line-height:1.6}
    a{display:inline-flex;margin-top:18px;min-height:44px;align-items:center;justify-content:center;padding:0 18px;border-radius:11px;background:#1769d2;color:#fff;text-decoration:none;font-weight:700}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script>
    (function () {
      var target = 'admin-user-month-import.html' + window.location.search + window.location.hash;
      window.location.replace(target);
    }());
  </script>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" aria-hidden="true"></div>
    <h1>กำลังเปิดหน้าแผนงานรายบุคคล</h1>
    <p>เมนูนำเข้าเดิมถูกรวมไว้ในหน้าสร้างและอัปโหลดแผนงานรายบุคคลแล้ว</p>
    <a href="admin-user-month-import.html">ไปยังหน้าปัจจุบัน</a>
  </main>
</body>
</html>
