<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นำเข้าข้อมูลร้าน</title><link rel="stylesheet" href="assets/css/app.css"><style>.wide{max-width:1200px}.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.table-wrap{overflow:auto;max-height:55vh}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th,.data-table td{padding:8px;border-bottom:1px solid #ddd;white-space:nowrap}.bad{background:#fff1f2}.good{background:#f0fdf4}.summary{display:flex;gap:12px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;background:#eef2ff}</style></head><body><header class="topbar"><strong>Admin — นำเข้าข้อมูลร้านและงาน</strong><nav><a href="admin.html" style="color:#fff">QR และรหัสกลาง</a></nav></header><main class="page wide"><section class="panel"><h2>1. เลือกไฟล์งาน</h2><p class="muted">รองรับ Excel (.xlsx/.xls) และ CSV แถวแรกต้องเป็นชื่อคอลัมน์</p><input id="fileInput" class="input" type="file" accept=".xlsx,.xls,.csv"><div class="toolbar"><label>รหัสรอบงาน<input id="roundId" class="input" placeholder="เช่น 2026-07-R01"></label><label>ชื่อรอบงาน<input id="roundName" class="input"></label><label>วันวิ่งงานเริ่มต้น<input id="workDate" class="input" type="date"></label><label>ช่องรูปบิลเริ่มต้น<input id="receiptSlots" class="input" type="number" value="3" min="0" max="30"></label><label>ช่องรูปร้านเริ่มต้น<input id="storeSlots" class="input" type="number" value="5" min="0" max="30"></label><label>Admin Bootstrap Token<input id="adminTokenImport" class="input" type="password"></label></div><div class="actions"><button id="previewBtn" class="btn btn-primary">ตรวจสอบไฟล์</button><button id="commitBtn" class="btn btn-primary" disabled>ยืนยันนำเข้า</button></div><div id="importStatus" class="status">ยังไม่ได้เลือกไฟล์</div></section><section class="panel"><h2>2. ผลตรวจสอบ</h2><div id="summary" class="summary"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>แถว</th><th>แบรนด์</th><th>รหัสร้าน</th><th>ชื่อร้าน</th><th>POS</th><th>รูปบิล</th><th>รูปร้าน</th><th>วันงาน</th><th>ผู้ปฏิบัติงาน</th><th>ผลตรวจ</th></tr></thead><tbody id="previewBody"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/admin-import.js"></script></body></html>
