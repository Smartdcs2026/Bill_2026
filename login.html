<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d47a1"><title>เข้าสู่ระบบ</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="assets/css/app.css"></head><body><main class="app-shell"><section class="card login-card"><div class="brand"><div class="brand-mark">▣</div><h1>เข้าสู่ระบบ</h1><p>ใช้ QR Code ที่ได้รับจากผู้ดูแลระบบ</p></div>
<section id="qrStep"><div class="stack"><button id="scanBtn" class="btn btn-primary">สแกน QR Code</button><button id="chooseBtn" class="btn btn-secondary">เลือกรูป QR จากโทรศัพท์</button><input id="qrFile" type="file" accept="image/*" class="hidden"><div id="cameraBox" class="camera-box"><video id="cameraVideo" playsinline muted></video><div class="scan-frame"></div></div><button id="stopBtn" class="btn btn-danger hidden">ปิดกล้อง</button></div></section>
<section id="codeStep" class="hidden"><div class="identity-card"><div class="avatar">👤</div><div><div class="muted small">พบผู้ใช้งาน</div><strong id="displayName">-</strong><div id="employeeCode" class="muted small"></div></div></div><label class="field-label" for="sharedCode">กรอกรหัสยืนยัน 10 หลัก</label><input id="sharedCode" class="input code-input" maxlength="10" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ตัวอักษรอังกฤษและตัวเลข"><div class="stack top-gap"><button id="loginBtn" class="btn btn-primary">เข้าสู่ระบบ</button><button id="rescanBtn" class="btn btn-secondary">สแกน QR ใหม่</button></div></section>
<div id="status" class="status">ยังไม่ได้สแกน</div><p class="muted small">QR เป็นข้อมูลส่วนบุคคล และรหัสยืนยันเป็นรหัสกลางที่ผู้ดูแลระบบกำหนด</p></section></main><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/login.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
